name: CI

# The 'validate' job runs automatically on every push and pull request.
# 'release' and 'refresh-lock' stay manual-only: both are gated on
# workflow_dispatch, not just on the task input, so a push can never publish.
# refresh-lock needs a Nexus API key. This repo is run without one, so that
# job is left in the file for completeness and is not scheduled.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - release
          - refresh-lock
          - prune-branches
      version:
        description: 'Release version, e.g. 1.2.0 (release only; leave blank to derive from the date)'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean
      apply:
        description: 'prune-branches only: actually delete. Left off, it only reports what it would delete.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref. Manual runs are never
# cancelled: a half-finished release is worse than a wasted minute.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:

  validate:
    name: Lint and validate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Pinned to the commit v7 pointed at on 2026-09-02. A tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          # Read-only job: do not hand the GITHUB_TOKEN to later steps as a git credential.
          persist-credentials: false

      - name: Install PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run tests
        shell: pwsh
        run: ./Invoke-Tests.ps1 -Output Detailed -SkipValidator

      - name: Run validator
        shell: pwsh
        run: ./Test-Modpack.ps1

      - name: Summarise the loadout
        shell: pwsh
        run: |
          $lock = Get-Content ./darktide-modpack.lock.json -Raw | ConvertFrom-Json
          $mapped = @($lock.mods | Where-Object { $_.modId }).Count
          $md = @()
          $md += "## Loadout: $($lock.name)"
          $md += ""
          $md += "| | |"
          $md += "|---|---|"
          $md += "| Mods | $($lock.modCount) |"
          $md += "| With a Nexus id | $mapped |"
          $md += "| Load order entries | $(@($lock.loadOrder).Count) |"
          $md += "| Lockfile generated | $($lock.generatedAt) |"
          $md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # ---------------------------------------------------------------------------
  # Windows PowerShell 5.1. The job above runs pwsh 7; this one runs the engine
  # that ships with Windows, which is what a user who has installed nothing gets.
  # Invoke-Tests.ps1 branches on $PSVersionTable.PSEdition -eq 'Desktop' and no
  # job had ever taken that branch, so the 5.1 path was asserted and untested.
  # It has already earned its place: the validator split on `u{001e}, an escape
  # PowerShell 7 added and 5.1 does not understand.
  # ---------------------------------------------------------------------------
  windows-powershell:
    name: Suite on Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm this really is Windows PowerShell 5.1
        shell: powershell
        # Cheap, and it is the whole point of the job: if the runner image ever
        # makes 'powershell' an alias for pwsh, every assertion below silently
        # becomes a duplicate of the job above.
        run: |
          $PSVersionTable | Format-Table -AutoSize | Out-String | Write-Host
          if ($PSVersionTable.PSEdition -ne 'Desktop') {
            throw "Expected the Desktop edition, got '$($PSVersionTable.PSEdition)'."
          }
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected PowerShell 5.x, got $($PSVersionTable.PSVersion)."
          }

      - name: Install Pester 5
        shell: powershell
        # 5.1 defaults to TLS 1.0 and ships Pester 3, so the gallery is
        # unreachable and the module is side by side rather than an upgrade.
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Validator runs clean on 5.1
        shell: powershell
        run: .\Test-Modpack.ps1

      - name: Suite runs on 5.1
        shell: powershell
        run: .\Invoke-Tests.ps1 -Output Detailed -SkipValidator

  # ---------------------------------------------------------------------------
  # Linux guard. The validator claims to be cross-platform and Invoke-Tests.ps1
  # claims to refuse the suite off Windows - neither claim is observable from a
  # windows-latest job, so both regressed silently until they were caught by hand.
  # ---------------------------------------------------------------------------
  cross-platform:
    name: Validator and guard on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The validator must stay genuinely cross-platform. A Windows-only path
      # pattern here is invisible on the Windows job but breaks this one.
      - name: Validator runs clean on Linux
        shell: pwsh
        run: ./Test-Modpack.ps1

      # Exit 3 means "nothing failed, but the suite was skipped". Asserting the
      # code, not just the text, is what stops it silently reverting to 0 - which
      # would let a caller read a skipped suite as a passing one.
      - name: Invoke-Tests refuses the suite and reports it as unverified
        run: |
          # No pipelines and no '|| true' around the runs being measured: both
          # clobber $? / PIPESTATUS and would make every assertion read 0, which
          # is exactly the false pass this step exists to catch.
          check() {
            local want=$1 label=$2; shift 2
            set +e
            "$@" >/tmp/invoke-tests.log 2>&1
            local got=$?
            set -e
            if [ "$got" -ne "$want" ]; then
              echo "::error::$label - expected exit $want, got $got"
              tail -n 20 /tmp/invoke-tests.log
              return 1
            fi
            echo "ok: $label -> $got"
          }

          check 3 "validator passed, suite skipped" \
                pwsh -NoProfile -File ./Invoke-Tests.ps1
          check 3 "nothing can run (-SkipValidator off Windows)" \
                pwsh -NoProfile -File ./Invoke-Tests.ps1 -SkipValidator
          check 0 "-AllowNonWindows genuinely runs Pester" \
                pwsh -NoProfile -File ./Invoke-Tests.ps1 -AllowNonWindows -Path Lock -Output None -SkipValidator
        shell: bash

      # Packaging is the one irreversible path here and it used to run only during a
      # real publish. Building it on every push means a broken allow-list is a red
      # build rather than a bad release. -NoArchive stages and scans; it publishes
      # nothing and needs no version.
      - name: The release package still builds
        shell: pwsh
        run: |
          ./New-ReleasePackage.ps1 -Destination "$env:RUNNER_TEMP/pkg" -NoArchive -Confirm:$false
          $staged = Join-Path $env:RUNNER_TEMP 'pkg/darktide-mods'
          foreach ($needed in @('darktide.ps1', 'README.md', 'LICENSE', 'tests')) {
            if (-not (Test-Path -LiteralPath (Join-Path $staged $needed))) {
              throw "staged package is missing $needed"
            }
          }
          # What must never leave the repo, asserted against the staged tree rather
          # than trusted from the allow-list.
          $leaked = @(Get-ChildItem -LiteralPath $staged -Recurse -File |
                      Where-Object { $_.Extension -in @('.mod', '.zip') -or
                                     $_.Name -in @('config.json', 'nexus-catalog.json') })
          if ($leaked) { throw "staged package leaked: $(($leaked | ForEach-Object { $_.Name }) -join ', ')" }

      # The setup script is the only shell in the repo and nothing else checks it.
      - name: Lint the test-environment setup script
        run: |
          set -euo pipefail
          script=.claude/skills/validate-change/scripts/setup-test-env.sh
          bash -n "$script"
          shellcheck "$script"
          "$script" --check || [ $? -eq 3 ]   # 3 = tools absent, which is expected here
        shell: bash

  # ---------------------------------------------------------------------------
  # Build a release zip and publish it.
  # Ships the tooling and the manifest. Never any mod files.
  # ---------------------------------------------------------------------------
  release:
    name: Build and publish release
    # Every guard, not just the Windows one: publishing is irreversible, so a red
    # Linux or macOS run should stop it too.
    needs: [validate, cross-platform, macos]
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'release'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          # Publish job: do not persist GITHUB_TOKEN as a git credential for later steps.
          persist-credentials: false

      - name: Resolve version
        id: ver
        shell: pwsh
        # The input arrives through the environment, never pasted into the script
        # body. Interpolating it inside a quoted PowerShell string lets a value
        # containing a quote close that string and run arbitrary code, in a job
        # that holds contents:write and a release token.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = "$($env:INPUT_VERSION)".Trim()
          if (-not $v) { $v = (Get-Date -Format 'yyyy.MM.dd') + '.' + $env:GITHUB_RUN_NUMBER }
          # Constrain the shape before it reaches a tag name, a filename and
          # GITHUB_OUTPUT. A newline here would forge extra step outputs.
          if ($v -notmatch '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$') {
              throw "Refusing version '$v': expected letters, digits and . + _ - only (max 64 chars)."
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $v"

      # Same script the push builds run, not a copy of it. The allow-list and the
      # forbidden-content scan live in one place so a release cannot ship something
      # the everyday check would have refused.
      - name: Stage and archive
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./New-ReleasePackage.ps1 -Destination dist -Version $env:VERSION -Confirm:$false

      - name: Write release notes
        shell: pwsh
        run: |
          $lock = Get-Content ./darktide-modpack.lock.json -Raw | ConvertFrom-Json
          $n = @()
          $n += "### What this is"
          $n += ""
          $n += "Tooling plus a **manifest** for a $($lock.modCount)-mod Darktide loadout."
          $n += "No mod files are included or redistributed - the lockfile tells you which mods to get and links to each author's Nexus page."
          $n += ""
          $n += "### Install"
          $n += ""
          $n += '```powershell'
          $n += 'Expand-Archive darktide-mods-*.zip -DestinationPath .\darktide-mods'
          $n += 'cd .\darktide-mods'
          $n += 'Copy-Item config.example.json config.json   # then edit the paths'
          $n += '.\darktide.ps1 status'
          $n += '```'
          $n += ""
          $n += "### Mods in this loadout"
          $n += ""
          $n += "| Mod | Version | Page |"
          $n += "|---|---|---|"
          foreach ($m in ($lock.mods | Sort-Object folder)) {
            $ver  = if ($m.version) { $m.version } else { '-' }
            $link = if ($m.url) { "[$($m.modId)]($($m.url))" } else { '_unmapped_' }
            $n += "| $($m.name) | $ver | $link |"
          }
          $n -join "`n" | Out-File release-notes.md -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $v = $env:VERSION
          $pre = if ($env:PRERELEASE -eq 'true') { '--prerelease' } else { '' }
          gh release create "v$v" `
            "dist/darktide-mods-$v.zip" `
            "dist/darktide-mods-$v.zip.sha256" `
            --title "darktide-mods v$v" `
            --notes-file release-notes.md `
            $pre

  refresh-lock:
    name: Refresh lockfile from Nexus
    needs: [validate, cross-platform, macos]
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'refresh-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          # Publish job: do not persist GITHUB_TOKEN as a git credential for later steps.
          persist-credentials: false

      - name: Check for the API key
        shell: pwsh
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: |
          if (-not $env:NEXUS_API_KEY) {
            throw "The NEXUS_API_KEY repository secret is not set. This job is unused on this repo."
          }

      - name: Query Nexus for current versions
        shell: pwsh
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content ./darktide-modpack.lock.json -Raw | ConvertFrom-Json
          $headers = @{
            apikey                = $env:NEXUS_API_KEY
            Accept                = 'application/json'
            'Application-Name'    = 'darktide-mods-ci'
            'Application-Version' = '1.0.0'
          }
          $changed = 0
          $rows    = @()
          foreach ($m in $lock.mods) {
            if (-not $m.modId) { continue }
            $uri = "https://api.nexusmods.com/v1/games/$($lock.game)/mods/$($m.modId).json"
            try {
              $r = Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 45
            } catch {
              Write-Host "::warning::mod $($m.modId) ($($m.folder)) could not be queried: $($_.Exception.Message)"
              continue
            }
            $latest = "$($r.version)"
            if ($latest -and $latest -ne "$($m.version)") {
              $rows += "| $($m.name) | $($m.version) | **$latest** | $($m.url) |"
              $m.version       = $latest
              $m.versionSource = 'nexus-api'
              $changed++
            }
            Start-Sleep -Milliseconds 400
          }
          if ($changed -gt 0) {
            $lock.generatedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            $lock.generatedBy = 'ci/refresh-lock'
            $lock | ConvertTo-Json -Depth 8 | Set-Content ./darktide-modpack.lock.json -Encoding utf8
          }
          $body = @("Updated **$changed** mod version(s) from the Nexus API.", "")
          if ($rows) {
            $body += "| Mod | Was | Now | Page |"
            $body += "|---|---|---|---|"
            $body += $rows
          }
          $body -join "`n" | Out-File pr-body.md -Encoding utf8
          "CHANGED=$changed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Open pull request
        if: env.CHANGED != '0'
        # Pinned to the commit v8 pointed at on 2026-08-30. A tag can be moved;
        # this job has contents:write and pull-requests:write, so it should not be.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          commit-message: 'chore: refresh lockfile versions from Nexus'
          branch: ci/refresh-lockfile
          delete-branch: true
          title: 'chore: refresh lockfile versions'
          body-path: pr-body.md
          add-paths: darktide-modpack.lock.json

      - name: Nothing to do
        if: env.CHANGED == '0'
        run: echo "All locked versions already match Nexus."

  # ---------------------------------------------------------------------------
  # macOS. The README, CLAUDE.md, Invoke-Tests.ps1's own help and two skills all
  # say the validator runs on macOS and that the suite refuses itself there. None
  # of that was ever executed on a Mac - the Linux job was standing in for both
  # platforms, which is the same shape of gap as pwsh 7 standing in for 5.1.
  #
  # It also covers the one path where the two genuinely differ: macOS runners are
  # arm64, so anything that assumes an x86_64 download is wrong here and nowhere
  # else. setup-test-env.sh hardcoded linux-x64 until this job existed.
  # ---------------------------------------------------------------------------
  macos:
    name: Validator and guard on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report the platform
        shell: bash
        run: |
          echo "uname -s : $(uname -s)"
          echo "uname -m : $(uname -m)"
          echo "pwsh     : $(pwsh -NoProfile -c '$PSVersionTable.PSVersion.ToString()')"

      - name: Validator runs clean on macOS
        shell: pwsh
        run: ./Test-Modpack.ps1

      # The same exit-code contract the Linux job asserts. 3 means "nothing failed,
      # but the suite was skipped", and a caller must not be able to read that as a
      # pass. -Path Lock is platform-independent and must genuinely run.
      - name: Invoke-Tests refuses the suite and reports it as unverified
        shell: bash
        run: |
          check() {
            local want=$1 label=$2; shift 2
            set +e
            "$@" >/tmp/invoke-tests.log 2>&1
            local got=$?
            set -e
            if [ "$got" -ne "$want" ]; then
              echo "::error::$label - expected exit $want, got $got"
              tail -n 20 /tmp/invoke-tests.log
              return 1
            fi
            echo "ok: $label -> $got"
          }

          check 3 "validator passed, suite skipped" \
                pwsh -NoProfile -File ./Invoke-Tests.ps1
          check 0 "-AllowNonWindows genuinely runs Pester" \
                pwsh -NoProfile -File ./Invoke-Tests.ps1 -AllowNonWindows -Path Lock -Output None -SkipValidator

      # The packaging must not be Linux-shaped either.
      - name: The release package still builds
        shell: pwsh
        run: ./New-ReleasePackage.ps1 -Destination "$env:RUNNER_TEMP/pkg" -NoArchive -Confirm:$false

      # The setup script picks its download from uname. This runner is arm64 Darwin,
      # which is the combination that was silently wrong before.
      - name: setup-test-env resolves the right macOS build
        shell: bash
        run: |
          script=.claude/skills/validate-change/scripts/setup-test-env.sh
          bash -n "$script"
          # shellcheck is not on the macOS image by default; the Linux job lints it.
          rid=$(. <(sed -n '/^pwsh_rid()/,/^}/p' "$script"); pwsh_rid)
          echo "resolved rid: $rid"
          case "$rid" in
            osx-arm64|osx-x64) ;;
            *) echo "::error::expected an osx build on macOS, got '$rid'"; exit 1 ;;
          esac
          url="https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-${rid}.tar.gz"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 60 "$url")
          [ "$code" = "200" ] || { echo "::error::$url returned $code"; exit 1; }
          echo "release asset for $rid exists"

  # ---------------------------------------------------------------------------
  # Delete branches whose work is already on the default branch.
  #
  # This exists because a branch delete cannot always be pushed from a working
  # environment - some network paths drop the delete refspec silently, and a
  # dropped delete reports "Everything up-to-date", which looks like success.
  # Running it here uses the repository's own token and leaves a run log.
  #
  # It never deletes on the strength of a name. Each branch has to prove itself
  # against one of three rules, and anything that proves nothing is reported and
  # left alone. Dry run unless 'apply' is ticked.
  # ---------------------------------------------------------------------------
  prune-branches:
    name: Prune branches already merged into main
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'prune-branches'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify and prune
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'

          base="origin/$DEFAULT_BRANCH"
          deleted=0; kept=0

          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v '^origin/HEAD$'); do
            b="${ref#origin/}"

            # Never the default branch, whatever any rule below might say.
            if [ "$b" = "$DEFAULT_BRANCH" ]; then continue; fi

            reason=""
            # 1. Every commit is already reachable from the default branch.
            if git merge-base --is-ancestor "$ref" "$base"; then
              reason="fully merged"
            else
              mb=$(git merge-base "$base" "$ref")
              files=$(git diff --name-only "$mb" "$ref")
              if [ -z "$files" ]; then
                reason="changes nothing"
              else
                # 2. Every file it touched is byte-identical to the default branch.
                identical=yes
                while IFS= read -r f; do
                  [ -z "$f" ] && continue
                  git diff --quiet "$base" "$ref" -- "$f" || identical=no
                done <<< "$files"

                if [ "$identical" = yes ]; then
                  reason="squash-merged; every file it touched matches $DEFAULT_BRANCH"
                else
                  # 3. Every line it ADDED is already present in the default branch.
                  #    Covers a branch whose files moved on after it was merged.
                  #
                  #    Both sides are stripped of leading whitespace before the
                  #    whole-line compare: matching a stripped line with grep -x
                  #    against an indented file can never succeed, which would turn
                  #    this rule off silently rather than making it strict.
                  #
                  #    The haystack is built once into a file, and the match below is
                  #    NOT a pipeline. 'git show | grep -q' looks equivalent and is
                  #    not: grep -q exits on the first hit, git show takes SIGPIPE and
                  #    returns 141, and under 'set -o pipefail' the pipeline then
                  #    reports failure for a line that was found. That reads as "this
                  #    branch still has unmerged work" and keeps a branch forever.
                  haystack=$(mktemp)
                  while IFS= read -r f; do
                    [ -z "$f" ] && continue
                    git show "$base:$f" 2>/dev/null | sed 's/^[[:space:]]*//' >> "$haystack" || true
                  done <<< "$files"

                  missing=0
                  while IFS= read -r line; do
                    [ -z "$line" ] && continue
                    grep -qxF -- "$line" "$haystack" || missing=$((missing + 1))
                  done <<< "$(git diff "$mb" "$ref" | sed -n 's/^+//p' | grep -v '^++' | sed 's/^[[:space:]]*//' | sort -u)"
                  rm -f "$haystack"

                  if [ "$missing" -eq 0 ]; then
                    reason="every line it added is already on $DEFAULT_BRANCH"
                  fi
                fi
              fi
            fi

            if [ -z "$reason" ]; then
              echo "KEEP    $b - carries work that is not on $DEFAULT_BRANCH"
              kept=$((kept + 1))
              continue
            fi

            if [ "$APPLY" != "true" ]; then
              echo "WOULD DELETE  $b - $reason"
            else
              echo "DELETE  $b - $reason"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$b"
            fi
            deleted=$((deleted + 1))
          done

          echo ""
          if [ "$APPLY" != "true" ]; then
            echo "Dry run. $deleted branch(es) would be deleted, $kept kept. Re-run with 'apply' ticked."
          else
            echo "Deleted $deleted branch(es), kept $kept."
          fi
